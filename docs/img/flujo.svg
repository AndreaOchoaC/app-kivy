<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 520" width="920" height="520" role="img" aria-label="Flujo de trabajo: cada alumno trabaja en su rama, cada push genera un APK y un IPA, y al final se mezcla todo en main">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#14142A"/><stop offset="1" stop-color="#08080F"/></linearGradient>
    <marker id="arr" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0,0 L10,5 L0,10 z" fill="#8E8EA8"/></marker>
    <style>
      text { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; fill: #F5F5F7; }
      .t { font-size: 14px; font-weight: 700; }
      .s { font-size: 12px; fill: #B4B4C8; }
      .h { font-size: 12px; font-weight: 700; fill: #8E8EA8; letter-spacing: 1.5px; }
      .arrow { stroke: #8E8EA8; stroke-width: 1.6; fill: none; marker-end: url(#arr); }
      .lane { stroke-width: 4; stroke-linecap: round; fill: none; }
    </style>
  </defs>
  <rect width="920" height="520" rx="22" fill="url(#bg)"/>
  <text x="34" y="44" class="h">FLUJO DE TRABAJO: UNA RAMA POR ALUMNO</text>

  <!-- carriles -->
  <text x="34" y="106" class="t">main</text>
  <line x1="110" y1="100" x2="880" y2="100" class="lane" stroke="#7C6CFF"/>
  <text x="34" y="206" class="t" style="fill:#FF5E8A">panel/pilar</text>
  <line x1="150" y1="200" x2="630" y2="200" class="lane" stroke="#FF5E8A"/>
  <text x="34" y="276" class="t" style="fill:#2FB8FF">panel/emiliano</text>
  <line x1="180" y1="270" x2="630" y2="270" class="lane" stroke="#2FB8FF"/>
  <text x="34" y="346" class="t" style="fill:#FBBF24">panel/jorge</text>
  <line x1="150" y1="340" x2="630" y2="340" class="lane" stroke="#FBBF24"/>

  <!-- ramas salen de main -->
  <path d="M130,100 C130,150 150,200 170,200" class="lane" stroke="#FF5E8A" style="opacity:.55"/>
  <path d="M130,100 C130,170 170,270 200,270" class="lane" stroke="#2FB8FF" style="opacity:.55"/>
  <path d="M130,100 C130,190 140,340 170,340" class="lane" stroke="#FBBF24" style="opacity:.55"/>

  <!-- commits -->
  <g fill="#08080F" stroke-width="3">
    <circle cx="260" cy="200" r="8" stroke="#FF5E8A"/><circle cx="360" cy="200" r="8" stroke="#FF5E8A"/><circle cx="470" cy="200" r="8" stroke="#FF5E8A"/>
    <circle cx="300" cy="270" r="8" stroke="#2FB8FF"/><circle cx="420" cy="270" r="8" stroke="#2FB8FF"/><circle cx="540" cy="270" r="8" stroke="#2FB8FF"/>
    <circle cx="240" cy="340" r="8" stroke="#FBBF24"/><circle cx="380" cy="340" r="8" stroke="#FBBF24"/><circle cx="510" cy="340" r="8" stroke="#FBBF24"/>
  </g>
  <text x="260" y="228" text-anchor="middle" class="s">git push</text>
  <text x="360" y="228" text-anchor="middle" class="s">git push</text>
  <text x="470" y="228" text-anchor="middle" class="s">git push</text>

  <!-- merges -->
  <path d="M630,200 C700,200 690,100 730,100" class="lane" stroke="#FF5E8A" style="opacity:.55"/>
  <path d="M630,270 C720,270 740,100 780,100" class="lane" stroke="#2FB8FF" style="opacity:.55"/>
  <path d="M630,340 C740,340 790,100 830,100" class="lane" stroke="#FBBF24" style="opacity:.55"/>
  <g fill="#08080F" stroke="#7C6CFF" stroke-width="3"><circle cx="730" cy="100" r="9"/><circle cx="780" cy="100" r="9"/><circle cx="830" cy="100" r="9"/></g>
  <text x="780" y="76" text-anchor="middle" class="s">merge de cada panel (Pull Request)</text>

  <!-- builds automáticos -->
  <rect x="34" y="388" width="852" height="100" rx="16" fill="#16161F" stroke="#34344C"/>
  <text x="54" y="414" class="h">EN CADA git push, GITHUB HACE SOLO ESTO (en la nube)</text>
  <rect x="54" y="428" width="150" height="46" rx="12" fill="#202030"/><text x="129" y="448" text-anchor="middle" class="t">1. Pruebas</text><text x="129" y="464" text-anchor="middle" class="s">tests + estilo</text>
  <path d="M206,451 L236,451" class="arrow"/>
  <rect x="240" y="428" width="170" height="46" rx="12" fill="#202030"/><text x="325" y="448" text-anchor="middle" class="t">2. Build Android</text><text x="325" y="464" text-anchor="middle" class="s">genera el .apk</text>
  <rect x="424" y="428" width="170" height="46" rx="12" fill="#202030"/><text x="509" y="448" text-anchor="middle" class="t">3. Build iOS</text><text x="509" y="464" text-anchor="middle" class="s">genera el .ipa</text>
  <path d="M596,451 L626,451" class="arrow"/>
  <rect x="630" y="428" width="238" height="46" rx="12" fill="#1B2B25" stroke="#34D399"/><text x="749" y="448" text-anchor="middle" class="t">Release  build-panel-pilar</text><text x="749" y="464" text-anchor="middle" class="s">descargas el APK / IPA de tu rama</text>
</svg>
