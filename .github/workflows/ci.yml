name: Pruebas

# Corre en cada push (de cualquier rama) y en cada pull request. Es rápido (1-2 minutos) y es
# lo que protege a main: si el panel de un alumno rompe algo, aquí se ve ANTES de mezclarlo.
# Prueba automáticamente TODOS los paneles de panels/ (ver tests/test_panels.py).
on:
  push:
  pull_request:
    branches: [main]

# Si subes otro commit mientras se está probando el anterior, cancela el viejo.
concurrency:
  group: ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
          cache-dependency-path: requirements*.txt

      # Kivy necesita una pantalla y OpenGL aunque sea virtual: xvfb + Mesa (render por software).
      - name: Instalar librerías de sistema (pantalla virtual)
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb libgl1 libgl1-mesa-dri libglx-mesa0 libegl1

      - name: Instalar dependencias
        run: python -m pip install -r requirements-dev.txt

      - name: Revisar estilo (ruff)
        run: python -m ruff check .

      - name: Ejecutar pruebas
        env:
          LIBGL_ALWAYS_SOFTWARE: "1"
        run: xvfb-run -a -s "-screen 0 1280x800x24" python -m pytest
