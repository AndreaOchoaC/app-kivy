name: Limpiar builds de ramas borradas

# Cuando se borra una rama (por ejemplo, después de hacer merge de un panel), se borra también
# su release «build-<rama>» con el APK y el IPA, para no acumular basura.
on: delete

permissions:
  contents: write

jobs:
  cleanup:
    if: github.event.ref_type == 'branch'
    runs-on: ubuntu-24.04
    steps:
      - name: Borrar la release de la rama
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          BRANCH: ${{ github.event.ref }}
        run: |
          slug=$(echo "$BRANCH" | tr '[:upper:]' '[:lower:]' | sed 's/[^a-z0-9._-]/-/g')
          gh release delete "build-${slug}" --cleanup-tag --yes || echo "No había release para esta rama."
